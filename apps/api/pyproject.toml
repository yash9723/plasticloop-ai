[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plasticloop-api"
version = "0.1.0"
description = "PlasticLoop AI backend — rural plastic waste collection, traceability and recovery (SIH26259)"
requires-python = ">=3.12"
# Exact versions are pinned in requirements.lock (generated inside python:3.12-slim).
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "python-multipart>=0.0.18",
  "paho-mqtt>=2.1",
  "ortools>=9.12",
  "opencv-python-headless>=4.10",
  "numpy>=2.0",
  "pandas>=2.2",
  "pillow>=11.0",
  "fpdf2>=2.8",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]
# Optional trained-model adapter (large: pulls torch). Not required to run the platform.
vision = ["ultralytics>=8.3"]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP046: PEP 695 generics on pydantic models would rename OpenAPI schemas (and the generated TS types).
ignore = ["E501", "B008", "UP046"]
