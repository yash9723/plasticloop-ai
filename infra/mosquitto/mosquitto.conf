# PlasticLoop AI — Mosquitto 2.0 broker configuration (development / LAN).
# Authentication is mandatory. Credentials are written by the API to the shared auth volume and
# reloaded automatically by entrypoint.sh. Topic access is restricted per device by the ACL.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/runtime/passwd
acl_file /mosquitto/runtime/acl

max_inflight_messages 20
max_queued_messages 1000
message_size_limit 8192

# --- Production: TLS listener (see docs/hardware/ESP32_INTEGRATION.md) ---
# listener 8883 0.0.0.0
# cafile /mosquitto/certs/ca.crt
