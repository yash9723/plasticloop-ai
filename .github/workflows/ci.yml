name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff + pytest on PostGIS)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: plasticloop
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: plasticloop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U plasticloop" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://plasticloop:ci-only@localhost:5432/plasticloop
      TEST_DATABASE_URL: postgresql+psycopg://plasticloop:ci-only@localhost:5432/plasticloop_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: pip install -r requirements.lock
      - run: ruff check .
      - run: python -m pytest -p no:warnings

  web:
    name: Web (i18n, lint, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:check
      - run: pnpm lint
      - run: pnpm test:web
      - run: pnpm build:web # includes the TypeScript check
